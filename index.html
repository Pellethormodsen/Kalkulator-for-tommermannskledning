<!doctype html><html lang="no"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tømmermannskledning kalkulator</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2563eb">
<link rel="apple-touch-icon" href="icon-192.png"><style>body{font-family:system-ui;max-width:520px;margin:24px auto;padding:18px;color:#111}main{border:1px solid #cbd5e1;border-radius:16px;padding:20px}label{display:block;font-weight:700;margin-top:14px}input,button{box-sizing:border-box;width:100%;padding:12px;font-size:18px;border-radius:9px}input{border:1px solid #94a3b8;margin-top:5px}button{border:0;background:#2563eb;color:#fff;font-weight:800;margin-top:18px}.r{margin-top:18px;padding:16px;border-radius:12px;background:#eff6ff}.big{font-size:34px;font-weight:900;color:#1d4ed8}.ok{color:#15803d;font-weight:800}.err{color:#b91c1c;font-weight:700;margin-top:12px}</style><main><h1>🔨 Tømmermannskledning</h1><p>Inndeling med 20–35 mm omlegg.</p><form id="f"><label>Mål «fra og forbi» (mm)</label><input id="m" type="number" min="1" value="4500" required><label>Bordbredde (mm)</label><input id="b" type="number" min="1" value="148" required><label>Ønsket spalte (mm)</label><input id="s" type="number" min="0" value="98" required><button>Regn ut</button></form><div id="err" class="err"></div><section id="res" class="r"><div>Bruk denne inndelingen:</div><div id="d" class="big"></div><div id="n"></div><hr><div id="g"></div><div id="o" class="ok"></div></section></main><script>(()=>{const f=document.querySelector('#f');function calc(){const M=+m.value,B=+b.value,S=+s.value;err.textContent='';if(!(M>0&&B>0&&S>=0)){err.textContent='Skriv inn gyldige mål.';res.style.display='none';return}let a=[],ideal=Math.max(1,Math.round(M/(B+S)));for(let n=Math.max(1,ideal-50);n<=ideal+50;n++){let del=M/n,gap=del-B,om=(B-gap)/2;if(gap>=0&&om>=20&&om<=35)a.push({n,del,gap,om,diff:Math.abs(gap-S)})}if(!a.length){err.textContent='Ingen inndeling gir omlegg mellom 20 og 35 mm med disse målene.';res.style.display='none';return}a.sort((x,y)=>x.diff-y.diff);let x=a[0];d.textContent=x.del.toFixed(1)+' mm';document.querySelector('#n').textContent=x.n+' bord / inndelinger';g.textContent='Faktisk spalte: '+x.gap.toFixed(1)+' mm';o.textContent='✓ Omlegg: '+x.om.toFixed(1)+' mm på hver side';res.style.display='block'}f.addEventListener('submit',e=>{e.preventDefault();calc()});calc()})()</script>
<script>if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js')); }</script>
</html>
